# All values injected via ConfigMap and Secret
spring.application.name=${SPRING_APPLICATION_NAME:api-gateway}
server.port=${SERVER_PORT:8080}
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://service-registry:8761/eureka}
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
eureka.client.register-with-eureka=${EUREKA_CLIENT_REGISTER_WITH_EUREKA:true}
eureka.client.fetch-registry=${EUREKA_CLIENT_FETCH_REGISTRY:true}
spring.cloud.gateway.server.webflux.discovery.locator.enabled=${SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_DISCOVERY_LOCATOR_ENABLED:true}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus,metrics}
management.prometheus.metrics.export.enabled=${MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED:true}
jwt.secret=${JWT_SECRET}

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=email-notification-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://email-notification-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/email-notification/**

spring.cloud.gateway.server.webflux.routes[2].id=room-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://room-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/room/**

spring.cloud.gateway.server.webflux.routes[3].id=reservation-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://reservation-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/reservations/**

spring.cloud.gateway.server.webflux.routes[4].id=staff-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://staff-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/staff/**

spring.cloud.gateway.server.webflux.routes[5].id=roomprice-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://roomprice-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/room-price/**
