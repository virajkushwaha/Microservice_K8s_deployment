version: '3.8'

services:

  # ─── Infrastructure ───────────────────────────────────────────────────────────

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hotel-net

  # ─── Service Registry (Eureka) ────────────────────────────────────────────────

  service-registry:
    build: ./backend/service-registry
    container_name: service-registry
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - hotel-net

  # ─── Backend Microservices ────────────────────────────────────────────────────

  auth-service:
    build: ./backend/auth-service
    container_name: auth-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_service_db
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - hotel-net

  room-service:
    build: ./backend/room-service
    container_name: room-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/room_db
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - hotel-net

  roomprice-service:
    build: ./backend/roomprice-service
    container_name: roomprice-service
    ports:
      - "8094:8094"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/room_db
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - hotel-net

  reservation-service:
    build: ./backend/reservation-service
    container_name: reservation-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/reservation_db
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - hotel-net

  staff-service:
    build: ./backend/staff-service
    container_name: staff-service
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/staff_db
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - hotel-net

  api-gateway:
    build: ./backend/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      service-registry:
        condition: service_healthy
    networks:
      - hotel-net

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      API_BASE_URL: http://localhost:8080
    depends_on:
      - api-gateway
    networks:
      - hotel-net

volumes:
  mysql_data:

networks:
  hotel-net:
    driver: bridge
