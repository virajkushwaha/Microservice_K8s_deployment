apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservation-service
  namespace: hotel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reservation-service
  template:
    metadata:
      labels:
        app: reservation-service
    spec:
      nodeSelector:
        role: worker
      initContainers:
        - name: wait-for-mysql
          image: busybox
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 3; done"]
        - name: wait-for-eureka
          image: busybox
          command: ["sh", "-c", "until nc -z service-registry 8761; do echo waiting for eureka; sleep 3; done"]
      containers:
        - name: reservation-service
          image: vivekkpaathak/microservice_project_new-reservation-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: reservation-service-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: mysql-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: mysql-password
